name: hamdolsunengelliyiz

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: hamdolsunengelliyiz-app
    restart: unless-stopped
    user: "1000:1000"
    userns_mode: keep-id
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app

  db:
    image: docker.io/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hamdolsunengelliyiz}
      MYSQL_USER: ${DB_USERNAME:-hamdolsun}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD_ROOT:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD_ROOT:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app

  mailpit:
    image: docker.io/axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - app

volumes:
  db_data:

networks:
  app:
    driver: bridge
